name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Add `cache: npm` once package-lock.json is committed (setup-node requires a lockfile).

      # Uses the lockfile when one is committed; falls back to a plain install before that.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: bash .github/ci-annotate.sh typecheck npm run typecheck

      - name: ESLint
        if: always()
        run: bash .github/ci-annotate.sh eslint npx eslint .

      - name: Prettier
        if: always()
        run: bash .github/ci-annotate.sh prettier npx prettier --check .

      - name: Test
        if: always()
        run: bash .github/ci-annotate.sh test npm run test

      - name: Build
        if: always()
        run: bash .github/ci-annotate.sh build npm run build
