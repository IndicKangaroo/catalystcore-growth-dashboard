name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strict install from the lockfile. If package.json changed without a matching lockfile
      # (for example when the author could not reach the npm registry), fall back to a plain
      # install so the checks below still run, and fail the "Lockfile in sync" step at the end.
      - name: Install
        id: install
        run: |
          if npm ci; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            npm install
          fi

      # The checks below run independently (if: always()) so one failure doesn't hide the others.
      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        if: always()
        run: npx eslint .

      # Marks each badly formatted file in the check annotations, so no one has to open the log.
      # CI makes Prettier print colour codes, which are removed before the file names are read.
      - name: Prettier
        if: always()
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -o pipefail
          if ! npx prettier --check . 2>&1 | tee prettier.log; then
            sed 's/\x1b\[[0-9;]*m//g' prettier.log | grep '^\[warn\] ' | grep -v 'Code style issues' | sed 's/^\[warn\] //' | while read -r file; do
              echo "::error file=${file},title=Prettier::${file} is not formatted. Run: npx prettier --write ${file}"
            done
            echo "::error title=Prettier output::$(tail -n 30 prettier.log | sed 's/\x1b\[[0-9;]*m//g' | head -c 3000 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"
            exit 1
          fi

      - name: Test
        if: always()
        run: npm run test

      - name: Build
        if: always()
        run: npm run build

      - name: Lockfile in sync
        if: always() && steps.install.outputs.in_sync == 'false'
        run: |
          echo "::error title=Lockfile out of date::package-lock.json does not match package.json. Run npm install and commit the updated package-lock.json."
          exit 1

  # Signs in against the real Firebase Auth and Firestore emulators. The unit tests fake both, so
  # this is what proves the wiring between them works (D-026). Needs Java for the Firestore emulator.
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The "check" job is the one that reports an out-of-date lockfile; a plain install is enough here.
      - name: Install
        run: npm ci || npm install

      - name: Sign-in tests against the emulators
        run: |
          set -o pipefail
          npm run test:emulator 2>&1 | tee emulator-test.log

      # Puts the end of the output into the check annotations, so the result (and, on a failure, the
      # reason) is readable without opening the full log.
      - name: Report emulator results
        if: always()
        run: |
          annotate() { # level, title, file, number of lines
            [ -f "$3" ] || return 0
            text="$(tail -n "$4" "$3" | sed 's/\x1b\[[0-9;]*m//g' | head -c 3500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"
            echo "::$1 title=$2::${text}"
          }
          if [ "${{ job.status }}" = "success" ]; then
            annotate notice "Emulator tests passed" emulator-test.log 25
          else
            annotate error "Emulator tests: end of the test output" emulator-test.log 60
            annotate error "Emulator tests: end of firebase-debug.log" firebase-debug.log 40
          fi
